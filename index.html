const peopleSeed=[{id:'kesemay',nameAm:'ከሰማይ',nameEn:'Kesemay',regular:true},{id:'meron',nameAm:'ሜሮን',nameEn:'Meron',regular:false,noteAm:'በመደበኛነት እንድትመጣ አትጠበቅም።',noteEn:'Not expected to attend regularly.'}];if(!localStorage.people)set('people',peopleSeed);
const reports=[
{id:'event',departmentAm:'ኢቨንት',departmentEn:'Event',am:`የጥቅምት ወር የኢቨንት ቲም ሪፖርት\n\nበጥቅምት ወር እቅድ የተያዘው የነበረው የሁሉም  ማዕከላት ሊደርስ እንዲሁም HQ ሊደርስ የራዕይ የማጋራት ፕሮግራም ከተጋባዥ 2እንግዶች ጋር በጃክሮስ ሪትሪት ማዕከል ጥቅምት28 ቅዳሜ ተደርጓል ።`,en:`October Event Team Report\n\nThe vision-sharing program planned for October, intended to reach all centers as well as HQ, was held with two invited guests at the Jakros Retreat Center on Saturday, Tikimt 28.`},
{id:'counseling',departmentAm:'ካውንስሊንግ',departmentEn:'Counseling',am:`የcounseling department የጥቅምት ወር ሪፖርት\n\nበየማዕከሉ ላሉ ልጆች በእሁድ ፕሮግራም ላይ ሊሰጥ የነበረው basic counseling skills focusing on peer በሌሎች ፕሮግራሞች መጣበብ ወደ ህዳር የተላፈ ሆኗል።`,en:`Counseling Department October Report\n\nThe basic counseling skills training focusing on peers, which was to be given to the young people at each center during the Sunday program, was postponed to Hidar because of congestion with other programs.`},
{id:'research',departmentAm:'ምርምርና ሥልጠና',departmentEn:'Research and Training',am:`-አስከ ጥቅምት 30 በባለፈው አመት የተሰራ ጥናት ውጤት ዝርዝር ጨርሶ ለየሴንተሮች እና ለዋና ቢሮ ሊገባ ታቅዶ የነበረው ይስራበት የነበረው ሶፍትየር ፍቃድ ዕድሳት በክፍያ በመጠየቁ(በዶላር) በመዘግየቱ ምክያት ተቁዋርጦ የነበረ ሲሆን አሁን እየተሰራበት ነው።\n\n-Multitopic study የትምህርት/ስልጠና ፍላጎታቸውን፣ስለፈተናዎቻቸው፣ከወላጆቻቸው ጋር ስላላቸው ግንኙነት፣በሚኒስትሪው የጠለቀ ህብረት ወይም ቤተሰባዊነት ስሜት ስለመኖሩ ና ስለጋይዮስ የቆይታ ጊዜ ማጠር ምርምር የሚሆን መጠይቅ ማዘጋጀት እስከ ጥቅምት 30 የታቀደ የነበር በስራ ላይ ያለ ያላለቀ ነው።`,en:`The detailed results of last year's study were planned to be completed and submitted to each center and HQ by Tikimt 30. Work had stopped because renewal of the software license required payment in dollars and was delayed; work has now resumed.\n\nThe multitopic study questionnaire covers education or training needs, challenges, relationships with parents, whether there is deep fellowship or a sense of family in the ministry, and reasons for shortened stays at GAIUS. It was planned for completion by Tikimt 30 and remains in progress.`},
{id:'followup',departmentAm:'ክትትል',departmentEn:'Follow-up',am:`ጋይዮስ ሚኒስትሪ ክትትል ዲፓርትመንት\nየጥቅምት ወር የገርጂ ፣ መካኒሳና ቢሾፍቱ ማዕከል ሪፖርት\n\nበዋና ቢሮ የተሰሩ ስራዎች\n1) በተያዘው እቅድ መሰረት የቢሾፍቱ ማዕከልና የመካነሳ ማዕከል ልጆችና መሪዎች ተተኪ መሪዎች AI እና self-descipline በሚል ርዕስ የተዘጋጀ material እየተጠና ይገኛል።\n2)በየማዕከላቱ follow Up በተመለከተ የሚሰሩ መደበኛ ስራዎች እየተከናወኑ መሆናቸውን በተወካዩች በኩል መከታተል ችሏል፡፡\n\nየመካኒሳ ማዕከል\n1) ከልጆች ጋር በዚ ወር ከሁሉም ፎርማል አባላት ጋር የቴሌግራም ጥናት AI በሚል ርዕስ ተደርጓል\n2) ከልጆች ጋር የተጀመረው "መልካም ጀነራሎች" የሚለው መጽሐፍ እየተጠና ነው\n3) በመሪዋች ስብሰባ ላይ ስለ አገልግሎት ሁለት ተከታታይ ስለጠና ተሰቶል\n4) ልጆችን ማግኘት በሞላ ጎደል ጥሩ እየተደረገ ይገኛል (ይህም እየሆነ ያለዉ የሚያዘው ሰዉ በሚመቸዉ መንገድ (bible study,telegram video chat ,በአካል በመገናኘት ምቹ በሆኑ መንገዶች እየተከናወነ ይገኛል)\n\nየገርጂ ማዕከል\n1. Update በተደረገው የልጆች profile መሰረት አንድ መሪ ለሶስት ልጆች በቋሚነት እንዲደውሉና follow Up እንዲያደርጉ assign ተደርጓል\n2) Stewardship በሚል ርዕስ የተዘጋጀ material ማጥናት ተችሏል\n3) የፀሎት ርዕስ ከልጆቻችን በመቀበል መሪዎች መፀለይ ተችሏል\n4) በዚህ ወር በተደረገው እያንዳንዱ ፕሮግራም ከልጆች feedback መቀበል ተችሏል\n\nየቢሾፍቱ ማዕከል\n1) self - discipline በሚል ርዕስ የተዘጋጀ material መጣናት ተችሏል\n2) በስልክና በአካል የሚደረጉ ክትትሎች በተገቢው መንገድ ቀጥለዋል\n3) በማክሰኞ ከመሪዎችና ከልጆች ጋር እየተደረገ ያለው የbible study እንደቀጠለ ይገኛል\n4) ጥቅምት 13 መሪዎች በነበራቸው አዳር ላይ mentorship በሚል ርዕስ ስልጠና መውስድ ተችሏል`,en:`GAIUS Ministry Follow-up Department\nOctober report for Gerji, Mekanisa, and Bishoftu centers\n\nHQ work: AI and self-discipline material for the Bishoftu and Mekanisa young people, leaders, and successor leaders is being studied. Representatives confirmed that regular follow-up work continues in each center.\n\nMekanisa: a Telegram AI study was held with formal members; the book “Good Generals” remains under study; leaders received two consecutive ministry trainings; contact with young people continues through Bible study, Telegram video chat, and in-person meetings.\n\nGerji: based on updated profiles, one leader was assigned to regularly call and follow up three young people; stewardship material was studied; leaders received prayer requests and prayed; feedback was collected after each program.\n\nBishoftu: self-discipline material was studied; telephone and in-person follow-up continued; Tuesday Bible study with leaders and young people continued; leaders received mentorship training during the Tikimt 13 overnight program.`},
{id:'service',departmentAm:'አገልግሎት አስተባባሪ',departmentEn:'Ministry Coordination',am:`የላፍቶ፤ ደብረዘይት እና ገርጂ የጥቅምት ወር የአገልግሎት ክፍሎች ሪፖርት\n\nገርጂ\nጥቅምት 01፣ 08፣ 15 እና 22 ከፓስተር ፍጹም ጋር ትንቢተ ሚልክያስን የመጽሀፍ ጥናት ክፍል 1-4 ተምረዋል::\nጥቅምት 29 በኢቨንት የአገልግሎት ክፍል አማካኝነት የማዕከሉ መሪዎች፤ተጠባባቂ መሪዎች እና ልጆች በጋር በመሆን movie night አድርገዋል፡፡\n\nደብረ ዘይት\nጥቅምት 01 ከአገልጋይ ፍራኦል ጋር 1ኛ ጴጥሮስን የመጨረሻዉን ክፍል ተምረዋል::\nጥቅምት 08 የማዕከሉ መሪዎች፤ተጠባባቂ መሪዎች እና ልጆች በጋር በመሆን የጸሎት እና የአምልኮ ጊዜ ነበራቸዉ፡፡\nጥቅምት 15 እና 22 ከአገልጋይ ቅዱስ ጋር ወንጌል በሚል ርዕስ ክፍል 1 እና 2 ተምረዋል::\nጥቅምት 29 movie night አድርገዋል፡፡\n\nላፍቶ\nጥቅምት 01 በ1ኛ ዩሀንስ ጥናት ላይ የዉይይት ጊዜ ነበራቸዉ፡፡\nጥቅምት 08 ከፓስተር ዳኜ ጋር “የተከፈተ ሰማይ” በሚል ርዕስ ተምረዋል::\nጥቅምት 15 እና 22 ከፓስተር ኢሳያስ ጋር ደቀመዘሙር ክፍል 1 እና 2 ተምረዋል::\nጥቅምት 29 በደቀመዘሙር ትምህርት ላይ የዉይይት ጊዜ ነበራቸዉ፡፡\nጥቅምት 13 እና 20 አገልግሎት በሚል ርዕስ ለመሪዎች እና ተጠባባቂ መሪዎች ስልጠና ተሰጥቷል፡፡\n\nዋና ቢሮ\nጥቅምት 28 ‘vision oriented life’ በሚል ርዕስ ከሁሉም ማዕከል ካሉ መሪዎች፤ተጠባባቂ መሪዎች እና ተጋባዥ እንግዶች ጋር ዉይይት ተካሂዷል፡፡ በገርጂ ማዕከል የጋይዮስን ራዕይ የማካፈል ፕሮግራም ተካሂዷል፡፡`,en:`October Ministry Coordination Report for Lafto, Debre Zeit, and Gerji\n\nGerji: Malachi Bible study parts 1–4 were taught with Pastor Fitsum on Tikimt 1, 8, 15, and 22. A movie night was held on Tikimt 29 with leaders, successor leaders, and young people.\n\nDebre Zeit: the final part of 1 Peter was taught on Tikimt 1; prayer and worship were held on Tikimt 8; Gospel parts 1 and 2 were taught on Tikimt 15 and 22; a movie night was held on Tikimt 29.\n\nLafto: discussion on 1 John was held on Tikimt 1; “Open Heaven” was taught with Pastor Dagne on Tikimt 8; Discipleship parts 1 and 2 were taught with Pastor Isaias on Tikimt 15 and 22; discussion was held on Tikimt 29; ministry training was provided to leaders and successor leaders on Tikimt 13 and 20.\n\nHQ: a discussion titled “Vision Oriented Life” was held on Tikimt 28 with leaders and successor leaders from every center and invited guests. A GAIUS vision-sharing program was held at the Gerji center.`},
{id:'media',departmentAm:'ሚዲያ',departmentEn:'Media',am:`የጥቅምት ወር የጋይዮስ ሚዲያ ሪፖርት\n\nሁሉም social media በተያዘላቸው እቅድ መሰረት መቀጥል ተችሏል። ዶክመንቴሽን ተጠናክሮ ቀጥሏል። የመጽሃፍ ቅዱስ ጥቅሶች፣ የእሁድና የሰኞ ፕሮግራሞች ማስታወቂያ፣ የጥቅምት ወር ፎቶ ቪዲዮ፣ የ5 ቀን social media ካምፔን እና ዶክመንተሪ ተለቋል።\n\nFACEBOOK: oct 13-nov 12 118,181 view፣ 7,558 Engagement፣ 324 አዳዲስ ተከታዮች፣ በአጠቃላይ 26,024 ተከታዮች።\nTELEGRAM: oct 13-nov 12 1,863 ደርሰናል።\nINSTAGRAM: oct 13-nov 12 150,335 view፣ ከ420 በላይ follower፣ በአጠቃላይ 5,589 ተከታዮች።\nYOUTUBE: 4,800 view፣ ከ84 በላይ አዳዲስ ተከታዮች።\nTIK TOK: 44,000 view፣ ከ80 በላይ follower፣ በአጠቃላይ 30,480 ተከታዮች።\nWEB SITE: በ1 ወር ውስጥ 1 ጊዜ update ተደርጓል።`,en:`GAIUS Media Report for October\n\nAll social media work continued according to plan and documentation was strengthened. Bible verses, Sunday and Monday program announcements, an October photo video, a five-day social-media campaign, and a documentary were published.\n\nFacebook, Oct 13–Nov 12: 118,181 views, 7,558 engagements, 324 new followers, and 26,024 total followers.\nTelegram: reach of 1,863.\nInstagram: 150,335 views, more than 420 new followers, and 5,589 total followers.\nYouTube: 4,800 views and more than 84 new followers.\nTikTok: 44,000 views, more than 80 new followers, and 30,480 total followers.\nWebsite: updated once during the month.`}
];
function apply(v){lang=v;localStorage.glang=v;document.documentElement.lang=v;document.querySelectorAll('[data-am]').forEach(x=>x.textContent=x.dataset[v]);$('lang').value=v;$('langA').value=v;$('appTitle').textContent=$('title').textContent=v==='am'?'የጋይዮስ ሚኒስትሪ ማዕከል':'GAIUS Ministry Hub';$('logout').textContent=v==='am'?'ውጣ':'Log out';$('authBtn').textContent=mode==='in'?(v==='am'?'ግባ':'Sign in'):(v==='am'?'መዝግብ':'Register');if(me)render()}
function setMode(v){mode=v;$('nameBox').classList.toggle('hide',v==='in');$('roleBox').classList.toggle('hide',v==='in');$('inTab').classList.toggle('on',v==='in');$('upTab').classList.toggle('on',v==='up');apply(lang)}$('inTab').onclick=()=>setMode('in');$('upTab').onclick=()=>setMode('up');$('role').onchange=()=> $('codeBox').classList.toggle('hide',$('role').value!=='director');$('langA').onchange=e=>apply(e.target.value);$('lang').onchange=e=>apply(e.target.value);
$('authBtn').onclick=()=>{let users=get('users',[]),u=$('user').value.trim().toLowerCase(),p=$('pass').value;if(!u||p.length<6){$('authMsg').textContent=lang==='am'?'የተጠቃሚ ስምና 6+ ቁምፊ ያለው ይለፍ ቃል ያስገቡ።':'Enter a username and a password of 6+ characters.';return}if(mode==='up'){let n=$('regName').value.trim(),r=$('role').value;if(!n||users.some(x=>x.user===u)||['country_director','international_director'].includes(r)&&$('code').value!=='GAIUS-2026'){ $('authMsg').textContent=lang==='am'?'መረጃውን ያረጋግጡ።':'Check the information.';return}let person={id:uid(),nameAm:n,nameEn:n,regular:true};let ps=get('people',peopleSeed);ps.push(person);set('people',ps);users.push({id:person.id,user:u,pass:p,role:r});set('users',users);setMode('in');return}let x=users.find(x=>x.user===u&&x.pass===p);if(!x){$('authMsg').textContent=lang==='am'?'የመግቢያ መረጃ ትክክል አይደለም።':'Invalid sign-in.';return}sessionStorage.me=x.id;open(x)};
function isDirectorRole(r){return ['country_director','international_director'].includes(r)}function canViewReportsRole(r){return ['media_leader','followup_leader','service_leader','counseling_leader','research_leader','event_leader','admin_finance','monday_leader','country_director','international_director'].includes(r)}function open(x){me=x;$('auth').classList.add('hide');$('app').classList.remove('hide');document.querySelectorAll('.directorOnly').forEach(e=>e.classList.toggle('hide',!isDirectorRole(x.role)));let reportNav=document.querySelector('.nav[data-p="reports"]');if(reportNav)reportNav.classList.toggle('hide',!canViewReportsRole(x.role));$('reports').classList.toggle('hide',!canViewReportsRole(x.role));if(!canViewReportsRole(x.role)&&$('reports').classList.contains('on')){document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id==='attendance'))}apply(lang)}$('logout').onclick=()=>{sessionStorage.clear();location.reload()};
function fileData(inp,cb){let f=inp.files[0];if(!f)return cb(null);if(f.size>2*1024*1024)return alert(lang==='am'?'አባሪው ከ2MB በታች መሆን አለበት።':'Attachment must be under 2 MB.');let r=new FileReader;r.onload=()=>cb({name:f.name,type:f.type,data:r.result});r.readAsDataURL(f)}function attachment(a){return a?`<div class="attach">📎 <a href="${a.data}" download="${esc(a.name)}">${esc(a.name)}</a></div>`:''}
function renderPeople(){let ps=get('people',peopleSeed),at=get('attendance',[]),pr=get('projects',[]);$('people').innerHTML=ps.map(p=>{let a=at.filter(x=>x.personId===p.id),present=a.filter(x=>x.status==='present').length,required=p.regular!==false?a.length:a.filter(x=>x.status!=='permitted').length,rate=required?Math.round(present/required*100):0,projects=pr.filter(x=>x.owner===p.id).length;return `<div class="card profile"><div class="avatar">${esc((lang==='am'?p.nameAm:p.nameEn).slice(0,1))}</div><div><b>${esc(lang==='am'?p.nameAm:p.nameEn)}</b><div class="muted">${p.regular===false?(lang==='am'?p.noteAm:p.noteEn):''}</div><div>${lang==='am'?'የመገኘት መጠን':'Attendance rate'}: <b>${rate}%</b> · ${lang==='am'?'ፕሮጀክቶች':'Projects'}: ${projects} · ${lang==='am'?'ሪፖርቶች':'Reports'}: ${reports.length}</div></div></div>`}).join('');let opts=ps.map(p=>`<option value="${p.id}">${esc(lang==='am'?p.nameAm:p.nameEn)}</option>`).join('');$('attPerson').innerHTML=opts;$('proOwner').innerHTML=opts}
$('saveAtt').onclick=()=>{let a=get('attendance',[]);a.push({id:uid(),personId:$('attPerson').value,date:$('attDate').value||new Date().toISOString().slice(0,10),status:$('attStatus').value,note:$('attNote').value});set('attendance',a);render()};
function renderAtt(){let ps=get('people',peopleSeed);$('attList').innerHTML=get('attendance',[]).slice().reverse().map(a=>`<div class="item"><b>${esc((ps.find(p=>p.id===a.personId)||{} )[lang==='am'?'nameAm':'nameEn'])}</b> · ${a.date} · <span class="pill">${a.status==='present'?(lang==='am'?'ተገኝቷል':'Present'):a.status==='permitted'?(lang==='am'?'ፈቃድ ያለው':'Permitted'):(lang==='am'?'ቀርቷል':'Absent')}</span><div class="muted">${esc(a.note)}</div></div>`).join('')}
$('saveAnn').onclick=()=>fileData($('annFile'),f=>{let a=get('announcements',[]);a.push({id:uid(),title:$('annTitle').value,body:$('annBody').value,file:f,date:new Date().toISOString()});set('announcements',a);$('annTitle').value=$('annBody').value='';$('annFile').value='';render()});function renderAnn(){$('annList').innerHTML=get('announcements',[]).slice().reverse().map(a=>`<div class="item"><b>${esc(a.title)}</b><div>${esc(a.body)}</div>${attachment(a.file)}<div class="muted">${a.date.slice(0,10)}</div></div>`).join('')||'<span class="muted">—</span>'}
$('savePro').onclick=()=>fileData($('proFile'),f=>{let a=get('projects',[]);a.push({id:uid(),title:$('proTitle').value,body:$('proBody').value,owner:$('proOwner').value,due:$('proDue').value,status:$('proStatus').value,file:f});set('projects',a);render()});function renderPro(){let ps=get('people',peopleSeed);$('proList').innerHTML=get('projects',[]).map(a=>`<div class="item"><b>${esc(a.title)}</b> <span class="pill">${a.status}</span><div>${esc(a.body)}</div><div class="muted">${lang==='am'?'ኃላፊ':'Owner'}: ${esc((ps.find(p=>p.id===a.owner)||{})[lang==='am'?'nameAm':'nameEn'])} · ${a.due}</div>${attachment(a.file)}</div>`).join('')||'<span class="muted">—</span>'}
function renderReports(){if(!me||!canViewReportsRole(me.role)){ $('reportList').innerHTML=''; return }let cs=get('comments',{});$('reportList').innerHTML=reports.map(r=>{let c=cs[r.id]||'';return `<article class="card"><div class="top"><h2>${esc(lang==='am'?r.departmentAm:r.departmentEn)}</h2><span class="lock">🔒 ${lang==='am'?'የተዘጋ':'Locked'}</span></div><div class="reporttext">${esc(r[lang])}</div><hr><label>${lang==='am'?'የዳይሬክተር አስተያየት':'Director comment'}</label>${isDirectorRole(me.role)?`<textarea class="comment" data-id="${r.id}">${esc(c)}</textarea><button class="btn saveComment" data-id="${r.id}">${lang==='am'?'አስተያየት አስቀምጥ':'Save comment'}</button>`:`<div>${esc(c)||'—'}</div>`}</article>`}).join('')}
document.addEventListener('click',e=>{let b=e.target.closest('.saveComment');if(b){let cs=get('comments',{});cs[b.dataset.id]=document.querySelector(`.comment[data-id="${b.dataset.id}"]`).value;set('comments',cs);renderReports()}});
function render(){renderPeople();renderAtt();renderAnn();renderPro();renderReports()}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{if(b.dataset.p==='reports'&&!canViewReportsRole(me.role))return;document.querySelectorAll('.page').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p));document.querySelectorAll('.nav').forEach(n=>{n.classList.toggle('on',n===b);n.classList.toggle('ghost',n!==b)})});apply(lang);setMode('in');$('attDate').value=new Date().toISOString().slice(0,10);let u=get('users',[]).find(x=>x.id===sessionStorage.me);if(u)open(u);
})();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
